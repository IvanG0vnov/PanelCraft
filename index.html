<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PanelCraft — parametric furniture designer and cutting pattern optimizer">
  <title>PanelCraft — дизайн мебели и раскрой</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b85c2b'/%3E%3Cpath d='M8 20V12h6v8H8zm10 0V8h6v12h-6z' fill='%23fff7ef'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/designer" aria-label="PanelCraft">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="4" y="13" width="10" height="15" rx="1.5"/><rect x="16" y="4" width="12" height="24" rx="1.5"/><circle cx="25" cy="16" r="1.4"/></svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">PanelCraft</span>
          <span class="brand-tag" data-i18n="app.tagline">мебель · раскрой</span>
        </span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item" data-route="designer">
          <svg class="icon"><use href="#i-designer"></use></svg>
          <span data-i18n="nav.designer">Конструктор</span>
        </button>
        <button class="nav-item" data-route="parts">
          <svg class="icon"><use href="#i-parts"></use></svg>
          <span data-i18n="nav.parts">Детали</span>
          <span class="nav-count" id="nav-parts-count"></span>
        </button>
        <button class="nav-item" data-route="cutting">
          <svg class="icon"><use href="#i-cut"></use></svg>
          <span data-i18n="nav.cutting">Раскрой</span>
        </button>
        <button class="nav-item" data-route="materials">
          <svg class="icon"><use href="#i-layers"></use></svg>
          <span data-i18n="nav.materials">Материалы</span>
        </button>
        <button class="nav-item" data-route="project">
          <svg class="icon"><use href="#i-folder"></use></svg>
          <span data-i18n="nav.project">Проект</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-block">
          <div class="sidebar-label" data-i18n="app.workshop">Мастерская</div>
          <div class="project-mini">
            <span class="dot"></span>
            <span id="sidebar-project-name">—</span>
          </div>
          <div class="autosave" data-i18n="app.autosave">Автосохранение включено</div>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn" data-action="toggle-lang" title="RU / EN" aria-label="Switch language">
            <svg class="icon"><use href="#i-globe"></use></svg>
            <span id="lang-label">RU</span>
          </button>
          <button class="icon-btn" data-action="toggle-theme" title="Theme" aria-label="Toggle theme">
            <svg class="icon only-light"><use href="#i-moon"></use></svg>
            <svg class="icon only-dark"><use href="#i-sun"></use></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-title">
          <div class="eyebrow" data-i18n="app.workspace">Рабочее пространство</div>
          <h1 id="page-title">Конструктор</h1>
        </div>
        <div class="topbar-actions">
          <div class="project-chip" id="project-chip" title="">
            <svg class="icon"><use href="#i-folder"></use></svg>
            <span id="topbar-project-name">—</span>
          </div>
          <div class="topbar-sep"></div>
          <button class="icon-btn" data-action="open-help" title="Help" aria-label="Help">
            <svg class="icon"><use href="#i-help"></use></svg>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-item" data-route="designer">
      <svg class="icon"><use href="#i-designer"></use></svg><span data-i18n="nav.designer">Конструктор</span>
    </button>
    <button class="mobile-nav-item" data-route="parts">
      <svg class="icon"><use href="#i-parts"></use></svg><span data-i18n="nav.parts">Детали</span>
    </button>
    <button class="mobile-nav-item" data-route="cutting">
      <svg class="icon"><use href="#i-cut"></use></svg><span data-i18n="nav.cutting">Раскрой</span>
    </button>
    <button class="mobile-nav-item" data-route="materials">
      <svg class="icon"><use href="#i-layers"></use></svg><span data-i18n="nav.materials">Материалы</span>
    </button>
    <button class="mobile-nav-item" data-route="project">
      <svg class="icon"><use href="#i-folder"></use></svg><span data-i18n="nav.project">Проект</span>
    </button>
  </div>

  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-designer" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></symbol>
    <symbol id="i-parts" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4Z"/><path d="m7.5 10.5 2 2M10.5 7.5l2 2M13.5 4.5l2 2M4.5 13.5l2 2"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.8-1.3"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></symbol>
    <symbol id="i-euro" viewBox="0 0 24 24"><path d="M4 10h12M4 14h12M19 5a7 7 0 1 0 0 14"/></symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 9h20M6 5v14M18 5v14"/></symbol>
  </svg>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/model.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/designer.js"></script>
  <script src="js/views/parts.js"></script>
  <script src="js/views/cutting.js"></script>
  <script src="js/views/materials.js"></script>
  <script src="js/views/project.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
